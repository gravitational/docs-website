name: Partials build test
on:
  pull_request:
  merge_group:

jobs:
  partials-build:
    name: Partials build test
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-22.04-2core-arm64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "yarn"
      - name: Install deps
        run: yarn
      - name: Build the partials fixture site and check the output
        run: bash scripts/test-partials-build.sh
